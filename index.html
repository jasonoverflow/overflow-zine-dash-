<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overflow Zine Dash</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="zine">
      <header>
        <p class="eyebrow">MICRO ZINE GENERATOR</p>
        <h1>Overflow Zine Dash</h1>
        <p class="subtitle">A tiny machine for strange slogans and accidental manifestos.</p>
      </header>

      <section class="panel">
        <h2>Fresh Page</h2>
        <p id="zine-line" aria-live="polite">Press the button to spill a new line.</p>
        <button id="shuffle" type="button">Shuffle Line</button>
      </section>

      <section class="panel panel--list">
        <h2>Issue Notes</h2>
        <ul>
          <li>Made from leftovers, bright ink, and noisy margins.</li>
          <li>Every refresh is a new issue.</li>
          <li>Fold once. Share twice.</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
